<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>घर का खाना — मालिक डैशबोर्ड</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f8f1e7}.admin{max-width:1100px;margin:35px auto;padding:20px}.panel{background:white;border:1px solid #eadbca;border-radius:16px;padding:22px;margin:18px 0}.admin h1,.admin h2{font-family:'Baloo 2';color:#56291c}.admin input,.admin select,.admin textarea{padding:10px;border:1px solid #ddcbb8;border-radius:8px;font:16px Hind;width:100%;margin:5px 0 12px}.gridform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.order{border-bottom:1px solid #eee;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.status{padding:7px;border-radius:8px;background:#f7ead8}.hidden{display:none!important}@media(max-width:600px){.gridform{grid-template-columns:1fr}.admin{padding:12px}}
</style></head><body><div class="topline">घर का खाना • मालिक / मैनेजर पैनल</div><main class="admin"><a href="index.html">← वेबसाइट पर जाएँ</a><h1>🍲 घर का खाना — डैशबोर्ड</h1>
<section class="panel" id="loginPanel"><h2>मालिक लॉगिन</h2><p>यहाँ Supabase में बनाए गए मालिक के ईमेल और पासवर्ड से लॉगिन करें।</p><form id="loginForm"><label>ईमेल<input name="email" type="email" required></label><label>पासवर्ड<input name="password" type="password" required></label><button class="btn primary">लॉगिन करें</button><p id="loginMsg"></p></form></section>
<div id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>आज के ऑर्डर</h2><button class="btn light" id="logout">लॉगआउट</button></div>
<section class="panel"><h2>मेन्यू में नया खाना जोड़ें</h2><form id="menuForm" class="gridform"><label>खाने का नाम<input name="name" required placeholder="जैसे: कढ़ी-चावल"></label><label>कीमत (₹)<input name="price" type="number" min="1" required></label><label>किस समय का खाना?<select name="meal_type"><option value="breakfast">नाश्ता</option><option value="lunch">दोपहर</option><option value="dinner">रात</option></select></label><label>खाने का इमोजी<input name="emoji" value="🍱" maxlength="8"></label><label style="grid-column:1/-1">छोटा विवरण<input name="description" placeholder="जैसे: ताज़ा घर का बना खाना"></label><button class="btn primary">मेन्यू में जोड़ें</button></form><p id="menuMsg"></p></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>ऑर्डर की सूची</h2><button class="btn light" id="refresh">रिफ्रेश करें</button></div><div id="orders"><p>ऑर्डर लोड हो रहे हैं…</p></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
